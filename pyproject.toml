[project]
name = "mitre-mcp-server"
version = "0.3.0"
description = "MCP server providing access to MITRE ATT&CK threat intelligence framework"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Inoussa Mouiche", email = "mouiche@uwindsor.ca" }
]
license = { text = "Apache-2.0" }
keywords = ["mitre", "attack", "mcp", "threat-intelligence", "cybersecurity"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
# Upper bounds guard against breaking majors (mcp 2.0 removed FastMCP).
dependencies = [
    "mcp>=2.3.0,<3",
    "mitreattack-python>=6.3.1,<7",
]

[project.scripts]
mitre-mcp-server = "mitre_mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mitre_mcp_server"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ['py312']

[tool.ruff]
line-length = 100
target-version = "py312"

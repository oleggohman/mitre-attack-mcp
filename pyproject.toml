[project]
name = "mitre-mcp-server"
version = "0.4.0"
description = "MCP server providing access to MITRE ATT&CK threat intelligence framework"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Inoussa Mouiche", email = "mouiche@uwindsor.ca" }
]
license = { text = "Apache-2.0" }
keywords = ["mitre", "attack", "mcp", "threat-intelligence", "cybersecurity"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
# Upper bounds guard against breaking majors (mcp 2.0 removed FastMCP).
dependencies = [
    "mcp>=2.3.0,<3",
    "mitreattack-python>=6.3.1,<7",
]

[project.scripts]
mitre-mcp-server = "mitre_mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mitre_mcp_server"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1",
    "coverage>=7.17",
    "ruff>=0.17.3,<0.18",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "unit: no STIX data needed",
    "data: needs the STIX cache (added automatically to tests without unit/protocol)",
    "protocol: spawns the server over stdio",
]

[tool.coverage.run]
branch = true
source = ["src/mitre_mcp_server"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 100

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.ruff.lint.isort]
known-first-party = ["mitre_mcp_server"]
